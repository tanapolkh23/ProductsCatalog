<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Marble Home</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg: #0f0f0f;
  --surface: #1a1a1a;
  --surface2: #242424;
  --border: #2e2e2e;
  --gold: #c8a96e;
  --gold2: #a07840;
  --text: #f0ede8;
  --sub: #777;
  --red: #e05252;
  --green: #52c87a;
  --blue: #5299e0;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Sarabun', sans-serif;
  min-height: 100vh;
}

/* ===== LOGIN ===== */
#login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
}

.login-box {
  width: 340px;
  text-align: center;
}

.login-logo {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  color: var(--gold);
  letter-spacing: 4px;
  margin-bottom: 8px;
  text-transform: uppercase;
}

.login-title {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 32px;
  color: var(--text);
}

.login-field {
  width: 100%;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  font-family: 'Sarabun', sans-serif;
  font-size: 15px;
  color: var(--text);
  margin-bottom: 12px;
  outline: none;
  transition: border-color 0.2s;
}

.login-field:focus { border-color: var(--gold); }

.login-btn {
  width: 100%;
  padding: 14px;
  background: var(--gold);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-family: 'Sarabun', sans-serif;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 4px;
  transition: background 0.2s;
}

.login-btn:hover { background: var(--gold2); }
.login-error { color: var(--red); font-size: 13px; margin-top: 10px; }

/* ===== LAYOUT ===== */
#admin-screen { display: none; }

.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.admin-badge {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  background: var(--gold);
  color: #fff;
  padding: 3px 8px;
  border-radius: 4px;
  letter-spacing: 1px;
}

.topbar-title { font-size: 16px; font-weight: 700; }

.topbar-right { display: flex; gap: 10px; align-items: center; }

.btn-preview {
  padding: 8px 16px;
  background: transparent;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  color: var(--sub);
  font-family: 'Sarabun', sans-serif;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
  display: inline-block;
}

.btn-preview:hover { border-color: var(--gold); color: var(--gold); }

.btn-logout {
  padding: 8px 14px;
  background: transparent;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  color: var(--sub);
  font-family: 'Sarabun', sans-serif;
  font-size: 13px;
  cursor: pointer;
}

.main {
  padding: 24px 20px;
  max-width: 900px;
  margin: 0 auto;
}

/* ===== STATS ===== */
.stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 28px;
}

.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
}

.stat-label { font-size: 11px; color: var(--sub); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
.stat-val { font-size: 28px; font-weight: 700; color: var(--text); }
.stat-sub { font-size: 11px; color: var(--gold); margin-top: 2px; }

/* ===== SECTION HEADER ===== */
.sec-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.sec-title { font-size: 16px; font-weight: 700; }

.btn-add {
  padding: 9px 18px;
  background: var(--gold);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-family: 'Sarabun', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
}

.btn-add:hover { background: var(--gold2); }

/* ===== PRODUCT LIST ===== */
.product-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 32px; }

.product-row {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  transition: border-color 0.2s;
}

.product-row:hover { border-color: var(--gold); }

.prod-thumb {
  width: 56px;
  height: 56px;
  border-radius: 10px;
  object-fit: cover;
  flex-shrink: 0;
  background: var(--surface2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  overflow: hidden;
}

.prod-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }

.prod-info { flex: 1; min-width: 0; }
.prod-name { font-size: 14px; font-weight: 600; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prod-meta { font-size: 12px; color: var(--sub); }

.prod-price { font-size: 15px; font-weight: 700; color: var(--gold); flex-shrink: 0; }

.prod-cat-badge {
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 20px;
  background: var(--surface2);
  color: var(--sub);
  flex-shrink: 0;
}

.prod-actions { display: flex; gap: 6px; flex-shrink: 0; }

.btn-edit, .btn-del {
  padding: 7px 14px;
  border-radius: 7px;
  border: none;
  font-family: 'Sarabun', sans-serif;
  font-size: 13px;
  cursor: pointer;
  font-weight: 600;
  transition: opacity 0.2s;
}

.btn-edit { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.btn-edit:hover { border-color: var(--blue); color: var(--blue); }
.btn-del { background: transparent; color: var(--red); border: 1px solid transparent; }
.btn-del:hover { border-color: var(--red); }

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-overlay.open { display: flex; }

.modal-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 28px;
  animation: fadeIn 0.2s ease;
}

@keyframes fadeIn {
  from { opacity:0; transform: scale(0.97); }
  to   { opacity:1; transform: scale(1); }
}

.modal-title { font-size: 18px; font-weight: 700; margin-bottom: 24px; }

.form-group { margin-bottom: 18px; }
.form-label { font-size: 12px; color: var(--sub); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; display: block; }

.form-input, .form-select, .form-textarea {
  width: 100%;
  background: var(--surface2);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  font-family: 'Sarabun', sans-serif;
  font-size: 14px;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}

.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
.form-textarea { resize: vertical; min-height: 80px; }
.form-select option { background: var(--surface2); }

/* Image upload */
.img-upload-area {
  border: 2px dashed var(--border);
  border-radius: 10px;
  padding: 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
}
.img-upload-area:hover { border-color: var(--gold); background: rgba(200,169,110,0.05); }
.img-upload-area input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.upload-icon { font-size: 28px; margin-bottom: 8px; }
.upload-text { font-size: 13px; color: var(--sub); }
.upload-hint { font-size: 11px; color: var(--sub); opacity: 0.6; margin-top: 4px; }

/* Multi-image thumbnails */
#img-preview-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 10px;
}
.img-thumb {
  position: relative;
  width: 80px;
  height: 80px;
  border-radius: 8px;
  overflow: hidden;
  border: 1.5px solid var(--border);
  flex-shrink: 0;
}
.img-thumb img {
  width: 100%; height: 100%; object-fit: cover;
}
.img-thumb-del {
  position: absolute; top: 3px; right: 3px;
  background: rgba(0,0,0,0.75); color: #fff;
  border: none; border-radius: 50%;
  width: 20px; height: 20px; font-size: 10px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.img-thumb-badge {
  position: absolute; bottom: 3px; left: 3px;
  background: var(--gold); color: #fff;
  font-size: 9px; padding: 1px 5px; border-radius: 4px;
}
.img-add-btn {
  width: 80px; height: 80px;
  border: 2px dashed var(--border);
  border-radius: 8px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  cursor: pointer; color: var(--sub); font-size: 11px;
  gap: 4px; transition: all 0.2s; flex-shrink: 0;
  background: transparent;
  position: relative;
}
.img-add-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.img-add-btn:hover { border-color: var(--gold); color: var(--gold); }

/* Badge select */
.badge-opts { display: flex; gap: 8px; flex-wrap: wrap; }

.badge-opt {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  cursor: pointer;
  border: 1.5px solid var(--border);
  color: var(--sub);
  transition: all 0.2s;
  background: transparent;
  font-family: 'Sarabun', sans-serif;
}

.badge-opt.sel { border-color: var(--gold); color: var(--gold); background: rgba(200,169,110,0.1); }

/* Form row */
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* Modal footer */
.modal-footer { display: flex; gap: 10px; margin-top: 24px; }

.btn-save {
  flex: 1;
  padding: 13px;
  background: var(--gold);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-family: 'Sarabun', sans-serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

.btn-save:hover { background: var(--gold2); }

.btn-cancel {
  padding: 13px 20px;
  background: transparent;
  color: var(--sub);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-family: 'Sarabun', sans-serif;
  font-size: 15px;
  cursor: pointer;
}

/* ===== CONFIRM DELETE ===== */
.confirm-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px;
  width: 100%;
  max-width: 360px;
  text-align: center;
}

.confirm-icon { font-size: 40px; margin-bottom: 12px; }
.confirm-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
.confirm-sub { font-size: 14px; color: var(--sub); margin-bottom: 24px; }
.confirm-btns { display: flex; gap: 10px; }
.btn-confirm-del { flex: 1; padding: 12px; background: var(--red); color: #fff; border: none; border-radius: 8px; font-family: 'Sarabun', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; }
.btn-confirm-cancel { flex: 1; padding: 12px; background: transparent; color: var(--sub); border: 1.5px solid var(--border); border-radius: 8px; font-family: 'Sarabun', sans-serif; font-size: 15px; cursor: pointer; }

/* ===== TOAST ===== */
.toast {
  position: fixed;
  bottom: 28px;
  right: 28px;
  padding: 12px 20px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  z-index: 999;
  transform: translateY(80px);
  opacity: 0;
  transition: all 0.3s;
}

.toast.show { transform: translateY(0); opacity: 1; }
.toast.success { background: var(--green); color: #fff; }
.toast.error { background: var(--red); color: #fff; }

/* ===== EMPTY STATE ===== */
.empty {
  text-align: center;
  padding: 48px 20px;
  color: var(--sub);
  background: var(--surface);
  border: 1px dashed var(--border);
  border-radius: 12px;
}

.empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-text { font-size: 15px; }

/* Mobile */
@media (max-width: 600px) {
  .stats-row { grid-template-columns: 1fr 1fr; }
  .form-row { grid-template-columns: 1fr; }
  .prod-cat-badge { display: none; }
  .topbar-title { font-size: 14px; }
}
</style>
</head>
<body>

<!-- LOGIN -->

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxcRHYBqvoLKVSmuF-PnM8dJM4gy6cYhiElXerfPx-NMJh6Voz4s5Ntmj0Vb8HDDDE/exec';
const ADMIN_PASSWORD  = 'admin1234';
const IMGBB_KEY       = 'aed6617dbdca6c61ba88052b3d1930de';
const BADGE_LABELS    = { ready:'✓ พร้อมส่ง', hot:'🔥 ขายดี', new:'✨ ใหม่', sale:'💚 ลดราคา' };

let products   = [];
let editId     = null;
let deleteId   = null;
let imgFiles   = []; // เก็บไฟล์รูปที่รอ upload

// ===== JSONP =====
function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cb = 'cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
    window[cb] = (data) => { delete window[cb]; document.body.removeChild(script); resolve(data); };
    script.onerror = () => { delete window[cb]; reject(new Error('JSONP failed')); };
    document.body.appendChild(script);
  });
}

async function apiGet() {
  const data = await jsonp(APPS_SCRIPT_URL + '?action=list');
  return data.products || [];
}

async function apiCall(action, payload = {}) {
  let url = APPS_SCRIPT_URL + '?action=' + action + '&password=' + ADMIN_PASSWORD;
  if (payload.id)      url += '&id='   + encodeURIComponent(payload.id);
  if (payload.product) url += '&data=' + encodeURIComponent(JSON.stringify(payload.product));
  return jsonp(url);
}

// ===== UPLOAD รูปไป imgbb =====
async function uploadToImgbb(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = async (e) => {
      const base64 = e.target.result.split(',')[1];
      const formData = new FormData();
      formData.append('key', IMGBB_KEY);
      formData.append('image', base64);
      formData.append('name', file.name);
      try {
        const res  = await fetch('https://api.imgbb.com/1/upload', { method:'POST', body: formData });
        const data = await res.json();
        if (data.success) resolve(data.data.url);
        else reject(new Error(data.error?.message || 'Upload failed'));
      } catch(err) { reject(err); }
    };
    reader.readAsDataURL(file);
  });
}

async function uploadAllImages() {
  if (!imgFiles.length) return [];
  const urls = [];
  for (let i = 0; i < imgFiles.length; i++) {
    showToast(`⏳ กำลัง upload รูป ${i+1}/${imgFiles.length}...`, 'success');
    const url = await uploadToImgbb(imgFiles[i]);
    urls.push(url);
  }
  return urls;
}

// ===== SESSION =====
function checkSession() {
  if (sessionStorage.getItem('admin_logged_in') === 'yes') {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    loadProducts();
  }
}

function doLogin() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  if (u === 'admin' && p === '1234') {
    sessionStorage.setItem('admin_logged_in', 'yes');
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    loadProducts();
  } else {
    document.getElementById('login-err').textContent = 'Username หรือ Password ไม่ถูกต้อง';
  }
}

function doLogout() {
  sessionStorage.removeItem('admin_logged_in');
  document.getElementById('admin-screen').style.display = 'none';
  document.getElementById('login-screen').style.display  = 'flex';
  document.getElementById('login-pass').value = '';
}

// ===== LOAD =====
async function loadProducts() {
  document.getElementById('product-list').innerHTML =
    `<div class="empty"><div class="empty-icon">⏳</div><div class="empty-text">กำลังโหลด...</div></div>`;
  try {
    products = await apiGet();
    renderList();
  } catch {
    document.getElementById('product-list').innerHTML =
      `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">โหลดไม่ได้ ตรวจสอบ Apps Script</div></div>`;
  }
}

// ===== RENDER =====
function renderList() {
  const list = document.getElementById('product-list');
  const cats = new Set(products.map(p => p.cat));
  document.getElementById('stat-total').textContent  = products.length;
  document.getElementById('stat-cats').textContent   = cats.size;
  document.getElementById('stat-ready').textContent  = products.filter(p => p.badge==='ready'||p.badge==='hot').length;

  if (!products.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">📦</div><div class="empty-text">ยังไม่มีสินค้า</div></div>`;
    return;
  }
  list.innerHTML = products.map(p => {
    const imgs = p.img ? p.img.split('|').filter(Boolean) : [];
    return `
    <div class="product-row">
      <div class="prod-thumb">
        ${imgs.length ? `<img src="${imgs[0]}" alt="${p.name}">` : '🪑'}
        ${imgs.length > 1 ? `<span style="position:absolute;bottom:2px;right:4px;background:#000a;color:#fff;font-size:10px;padding:1px 5px;border-radius:8px">+${imgs.length-1}</span>` : ''}
      </div>
      <div class="prod-info">
        <div class="prod-name">${p.name}</div>
        <div class="prod-meta">${p.size ? p.size+' · ' : ''}${p.price ? p.price+' บาท' : ''}</div>
      </div>
      <div class="prod-cat-badge">${p.cat||''}</div>
      ${p.badge ? `<span style="font-size:12px;color:var(--gold)">${BADGE_LABELS[p.badge]||''}</span>` : ''}
      <div class="prod-actions">
        <button class="btn-edit" onclick="openForm('${p.id}')">✏️ แก้ไข</button>
        <button class="btn-del"  onclick="askDelete('${p.id}')">🗑</button>
      </div>
    </div>`;
  }).join('');
}

// ===== FORM =====
function openForm(id = null) {
  editId = id; imgFiles = [];
  document.getElementById('form-title').textContent = id ? 'แก้ไขสินค้า' : 'เพิ่มสินค้าใหม่';
  ['f-name','f-size','f-price','f-install','f-desc'].forEach(i => document.getElementById(i).value = '');
  document.getElementById('f-cat').value = 'ตู้เสื้อผ้า';
  document.querySelectorAll('.badge-opt').forEach(b => b.classList.remove('sel'));
  resetImgPreview();

  if (id) {
    const p = products.find(x => x.id == id);
    if (p) {
      document.getElementById('f-name').value    = p.name    || '';
      document.getElementById('f-cat').value     = p.cat     || 'ตู้เสื้อผ้า';
      document.getElementById('f-size').value    = p.size    || '';
      document.getElementById('f-price').value   = p.price   ? p.price.replace(/,/g,'') : '';
      document.getElementById('f-install').value = p.install || '';
      document.getElementById('f-desc').value    = p.desc    || '';
      if (p.badge) document.querySelector(`.badge-opt[data-val="${p.badge}"]`)?.classList.add('sel');
      // โหลดรูปเดิม
      if (p.img) {
        const urls = p.img.split('|').filter(Boolean);
        renderImgPreviews(urls);
      }
    }
  }
  document.getElementById('form-modal').classList.add('open');
}

function closeForm() {
  document.getElementById('form-modal').classList.remove('open');
  editId = null; imgFiles = [];
}

async function saveProduct() {
  const name  = document.getElementById('f-name').value.trim();
  const price = document.getElementById('f-price').value.trim();
  if (!name || !price) { showToast('กรุณากรอกชื่อสินค้าและราคา', 'error'); return; }

  const btn = document.querySelector('.btn-save');
  btn.textContent = '⏳ กำลังบันทึก...'; btn.disabled = true;

  try {
    // 1. upload รูปใหม่ก่อน
    const newUrls = await uploadAllImages();

    // 2. รวมกับรูปเดิม (ถ้า edit)
    let existingUrls = [];
    if (editId) {
      const old = products.find(p => p.id == editId);
      existingUrls = old?.img ? old.img.split('|').filter(Boolean) : [];
    }
    // เก็บรูปที่ยังอยู่ใน preview (ไม่ถูกลบ)
    const keptUrls = getKeptUrls();
    const allUrls  = [...keptUrls, ...newUrls];

    const badge    = document.querySelector('.badge-opt.sel')?.dataset.val || '';
    const priceStr = parseInt(price.replace(/,/g,'')).toLocaleString();
    const product  = {
      name,
      cat:     document.getElementById('f-cat').value,
      size:    document.getElementById('f-size').value.trim(),
      price:   priceStr,
      install: document.getElementById('f-install').value.trim(),
      desc:    document.getElementById('f-desc').value.trim(),
      badge,
      img:     allUrls.join('|') // เก็บหลาย URL คั่นด้วย |
    };

    if (editId) {
      await apiCall('update', { id: editId, product });
    } else {
      await apiCall('add', { product });
    }

    showToast(editId ? '✅ แก้ไขแล้ว' : '✅ เพิ่มสินค้าแล้ว', 'success');
    closeForm();
    await loadProducts();
  } catch(err) {
    showToast('❌ ' + (err.message || 'บันทึกไม่สำเร็จ'), 'error');
  } finally {
    btn.textContent = '💾 บันทึก'; btn.disabled = false;
  }
}

// ===== IMAGE PREVIEW (หลายรูป) =====
function handleImg(e) {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  const oversized = files.filter(f => f.size > 10 * 1024 * 1024);
  if (oversized.length) { showToast('รูปบางไฟล์ใหญ่เกิน 10MB', 'error'); return; }
  imgFiles = [...imgFiles, ...files];
  // preview รูปใหม่
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = ev => addImgPreview(ev.target.result, null, file.name);
    reader.readAsDataURL(file);
  });
  e.target.value = ''; // reset input
}

function addImgPreview(src, existingUrl = null, label = '') {
  const wrap = document.getElementById('img-preview-list');
  const div  = document.createElement('div');
  div.className = 'img-thumb';
  div.dataset.url = existingUrl || '';
  div.dataset.new = existingUrl ? 'false' : 'true';
  div.innerHTML = `
    <img src="${src}" alt="${label}">
    <button class="img-thumb-del" onclick="removeImgThumb(this)">✕</button>
    ${!existingUrl ? '<span class="img-thumb-badge">ใหม่</span>' : ''}
  `;
  wrap.appendChild(div);
  document.getElementById('upload-placeholder').style.display = 'none';
}

function renderImgPreviews(urls) {
  urls.forEach(url => addImgPreview(url, url));
}

function removeImgThumb(btn) {
  const div  = btn.closest('.img-thumb');
  const isNew = div.dataset.new === 'true';
  const label = div.querySelector('img').alt;
  if (isNew) {
    // ลบออกจาก imgFiles
    imgFiles = imgFiles.filter(f => f.name !== label);
  }
  div.remove();
  if (!document.querySelectorAll('.img-thumb').length) {
    document.getElementById('upload-placeholder').style.display = 'block';
  }
}

function getKeptUrls() {
  return Array.from(document.querySelectorAll('.img-thumb'))
    .filter(d => d.dataset.new === 'false')
    .map(d => d.dataset.url)
    .filter(Boolean);
}

function resetImgPreview() {
  document.getElementById('img-preview-list').innerHTML = '';
  document.getElementById('upload-placeholder').style.display = 'block';
  document.getElementById('img-file').value = '';
  imgFiles = [];
}

// ===== BADGE =====
function toggleBadge(btn) {
  const was = btn.classList.contains('sel');
  document.querySelectorAll('.badge-opt').forEach(b => b.classList.remove('sel'));
  if (!was) btn.classList.add('sel');
}

// ===== DELETE =====
function askDelete(id) {
  deleteId = id;
  const p = products.find(x => x.id == id);
  document.getElementById('del-name').textContent = `"${p?.name || 'สินค้านี้'}"`;
  document.getElementById('del-modal').classList.add('open');
}

async function confirmDelete() {
  document.getElementById('del-modal').classList.remove('open');
  try {
    await apiCall('delete', { id: deleteId });
    showToast('🗑 ลบสินค้าแล้ว', 'success');
    await loadProducts();
  } catch { showToast('❌ ลบไม่สำเร็จ', 'error'); }
}

// ===== TOAST =====
function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}

document.getElementById('form-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('form-modal')) closeForm();
});
document.getElementById('del-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('del-modal')) document.getElementById('del-modal').classList.remove('open');
});

checkSession();
</script>

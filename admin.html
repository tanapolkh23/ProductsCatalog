<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - SineEasy</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg: #0f0f0f;
  --surface: #1a1a1a;
  --surface2: #242424;
  --border: #2e2e2e;
  --gold: #c8a96e;
  --gold2: #a07840;
  --text: #f0ede8;
  --sub: #777;
  --red: #e05252;
  --green: #52c87a;
  --blue: #5299e0;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Sarabun', sans-serif;
  min-height: 100vh;
}

/* ===== LOGIN ===== */
#login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
}

.login-box {
  width: 340px;
  text-align: center;
}

.login-logo {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  color: var(--gold);
  letter-spacing: 4px;
  margin-bottom: 8px;
  text-transform: uppercase;
}

.login-title {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 32px;
  color: var(--text);
}

.login-field {
  width: 100%;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  font-family: 'Sarabun', sans-serif;
  font-size: 15px;
  color: var(--text);
  margin-bottom: 12px;
  outline: none;
  transition: border-color 0.2s;
}

.login-field:focus { border-color: var(--gold); }

.login-btn {
  width: 100%;
  padding: 14px;
  background: var(--gold);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-family: 'Sarabun', sans-serif;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 4px;
  transition: background 0.2s;
}

.login-btn:hover { background: var(--gold2); }
.login-error { color: var(--red); font-size: 13px; margin-top: 10px; }

/* ===== LAYOUT ===== */
#admin-screen { display: none; }

.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.admin-badge {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  background: var(--gold);
  color: #fff;
  padding: 3px 8px;
  border-radius: 4px;
  letter-spacing: 1px;
}

.topbar-title { font-size: 16px; font-weight: 700; }

.topbar-right { display: flex; gap: 10px; align-items: center; }

.btn-preview {
  padding: 8px 16px;
  background: transparent;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  color: var(--sub);
  font-family: 'Sarabun', sans-serif;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
  display: inline-block;
}

.btn-preview:hover { border-color: var(--gold); color: var(--gold); }

.btn-logout {
  padding: 8px 14px;
  background: transparent;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  color: var(--sub);
  font-family: 'Sarabun', sans-serif;
  font-size: 13px;
  cursor: pointer;
}

.main {
  padding: 24px 20px;
  max-width: 900px;
  margin: 0 auto;
}

/* ===== STATS ===== */
.stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 28px;
}

.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
}

.stat-label { font-size: 11px; color: var(--sub); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
.stat-val { font-size: 28px; font-weight: 700; color: var(--text); }
.stat-sub { font-size: 11px; color: var(--gold); margin-top: 2px; }

/* ===== SECTION HEADER ===== */
.sec-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.sec-title { font-size: 16px; font-weight: 700; }

.btn-add {
  padding: 9px 18px;
  background: var(--gold);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-family: 'Sarabun', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
}

.btn-add:hover { background: var(--gold2); }

/* ===== PRODUCT LIST ===== */
.product-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 32px; }

.product-row {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  transition: border-color 0.2s;
}

.product-row:hover { border-color: var(--gold); }

.prod-thumb {
  width: 56px;
  height: 56px;
  border-radius: 10px;
  object-fit: cover;
  flex-shrink: 0;
  background: var(--surface2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  overflow: hidden;
}

.prod-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }

.prod-info { flex: 1; min-width: 0; }
.prod-name { font-size: 14px; font-weight: 600; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prod-meta { font-size: 12px; color: var(--sub); }

.prod-price { font-size: 15px; font-weight: 700; color: var(--gold); flex-shrink: 0; }

.prod-cat-badge {
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 20px;
  background: var(--surface2);
  color: var(--sub);
  flex-shrink: 0;
}

.prod-actions { display: flex; gap: 6px; flex-shrink: 0; }

.btn-edit, .btn-del {
  padding: 7px 14px;
  border-radius: 7px;
  border: none;
  font-family: 'Sarabun', sans-serif;
  font-size: 13px;
  cursor: pointer;
  font-weight: 600;
  transition: opacity 0.2s;
}

.btn-edit { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.btn-edit:hover { border-color: var(--blue); color: var(--blue); }
.btn-del { background: transparent; color: var(--red); border: 1px solid transparent; }
.btn-del:hover { border-color: var(--red); }

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-overlay.open { display: flex; }

.modal-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 28px;
  animation: fadeIn 0.2s ease;
}

@keyframes fadeIn {
  from { opacity:0; transform: scale(0.97); }
  to   { opacity:1; transform: scale(1); }
}

.modal-title { font-size: 18px; font-weight: 700; margin-bottom: 24px; }

.form-group { margin-bottom: 18px; }
.form-label { font-size: 12px; color: var(--sub); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; display: block; }

.form-input, .form-select, .form-textarea {
  width: 100%;
  background: var(--surface2);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  font-family: 'Sarabun', sans-serif;
  font-size: 14px;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}

.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
.form-textarea { resize: vertical; min-height: 80px; }
.form-select option { background: var(--surface2); }

/* Image upload */
.img-upload-area {
  border: 2px dashed var(--border);
  border-radius: 10px;
  padding: 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
}
.img-upload-area:hover { border-color: var(--gold); background: rgba(200,169,110,0.05); }
.img-upload-area input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.upload-icon { font-size: 28px; margin-bottom: 8px; }
.upload-text { font-size: 13px; color: var(--sub); }
.upload-hint { font-size: 11px; color: var(--sub); opacity: 0.6; margin-top: 4px; }

/* Multi-image thumbnails */
#img-preview-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 10px;
}
.img-thumb {
  position: relative;
  width: 80px;
  height: 80px;
  border-radius: 8px;
  overflow: hidden;
  border: 1.5px solid var(--border);
  flex-shrink: 0;
}
.img-thumb img {
  width: 100%; height: 100%; object-fit: cover;
}
.img-thumb-del {
  position: absolute; top: 3px; right: 3px;
  background: rgba(0,0,0,0.75); color: #fff;
  border: none; border-radius: 50%;
  width: 20px; height: 20px; font-size: 10px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.img-thumb-badge {
  position: absolute; bottom: 3px; left: 3px;
  background: var(--gold); color: #fff;
  font-size: 9px; padding: 1px 5px; border-radius: 4px;
}
.img-add-btn {
  width: 80px; height: 80px;
  border: 2px dashed var(--border);
  border-radius: 8px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  cursor: pointer; color: var(--sub); font-size: 11px;
  gap: 4px; transition: all 0.2s; flex-shrink: 0;
  background: transparent;
  position: relative;
}
.img-add-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.img-add-btn:hover { border-color: var(--gold); color: var(--gold); }

/* Badge select */
.badge-opts { display: flex; gap: 8px; flex-wrap: wrap; }

.badge-opt {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  cursor: pointer;
  border: 1.5px solid var(--border);
  color: var(--sub);
  transition: all 0.2s;
  background: transparent;
  font-family: 'Sarabun', sans-serif;
}

.badge-opt.sel { border-color: var(--gold); color: var(--gold); background: rgba(200,169,110,0.1); }

/* Form row */
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* Modal footer */
.modal-footer { display: flex; gap: 10px; margin-top: 24px; }

.btn-save {
  flex: 1;
  padding: 13px;
  background: var(--gold);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-family: 'Sarabun', sans-serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

.btn-save:hover { background: var(--gold2); }

.btn-cancel {
  padding: 13px 20px;
  background: transparent;
  color: var(--sub);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-family: 'Sarabun', sans-serif;
  font-size: 15px;
  cursor: pointer;
}

/* ===== CONFIRM DELETE ===== */
.confirm-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px;
  width: 100%;
  max-width: 360px;
  text-align: center;
}

.confirm-icon { font-size: 40px; margin-bottom: 12px; }
.confirm-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
.confirm-sub { font-size: 14px; color: var(--sub); margin-bottom: 24px; }
.confirm-btns { display: flex; gap: 10px; }
.btn-confirm-del { flex: 1; padding: 12px; background: var(--red); color: #fff; border: none; border-radius: 8px; font-family: 'Sarabun', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; }
.btn-confirm-cancel { flex: 1; padding: 12px; background: transparent; color: var(--sub); border: 1.5px solid var(--border); border-radius: 8px; font-family: 'Sarabun', sans-serif; font-size: 15px; cursor: pointer; }

/* ===== TOAST ===== */
.toast {
  position: fixed;
  bottom: 28px;
  right: 28px;
  padding: 12px 20px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  z-index: 999;
  transform: translateY(80px);
  opacity: 0;
  transition: all 0.3s;
}

.toast.show { transform: translateY(0); opacity: 1; }
.toast.success { background: var(--green); color: #fff; }
.toast.error { background: var(--red); color: #fff; }

/* ===== EMPTY STATE ===== */
.empty {
  text-align: center;
  padding: 48px 20px;
  color: var(--sub);
  background: var(--surface);
  border: 1px dashed var(--border);
  border-radius: 12px;
}

.empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-text { font-size: 15px; }

/* ===== NAV TABS ===== */
.nav-tabs {
  display: flex;
  gap: 4px;
  padding: 0 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.nav-tab {
  padding: 12px 18px;
  font-size: 13px;
  font-family: 'Sarabun', sans-serif;
  color: var(--sub);
  border: none;
  background: transparent;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
}
.nav-tab.active { color: var(--gold); border-bottom-color: var(--gold); }
.nav-tab:hover  { color: var(--text); }

/* ===== CAT FILTER ===== */
.cat-filter-bar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.cat-filter-btn {
  padding: 6px 14px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: transparent;
  color: var(--sub);
  font-family: 'Sarabun', sans-serif;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}
.cat-filter-btn.active {
  border-color: var(--gold);
  color: var(--gold);
  background: rgba(200,169,110,0.1);
}

/* ===== CAT LIST ===== */
.cat-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
.cat-row {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.cat-icon-preview {
  width: 40px; height: 40px;
  border-radius: 10px;
  background: var(--surface2);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}
.cat-name { flex: 1; font-size: 14px; font-weight: 600; }
.cat-count { font-size: 12px; color: var(--sub); }

/* ===== PAGE ===== */
.page { display: none; }
.page.active { display: block; }

/* Mobile */
@media (max-width: 600px) {
  .stats-row { grid-template-columns: 1fr 1fr; }
  .form-row { grid-template-columns: 1fr; }
  .prod-cat-badge { display: none; }
  .topbar-title { font-size: 14px; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">SineEasy</div>
    <div class="login-title">Admin Panel</div>
    <input class="login-field" type="text" id="login-user" placeholder="Username" autocomplete="off">
    <input class="login-field" type="password" id="login-pass" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">เข้าสู่ระบบ</button>
    <div class="login-error" id="login-err"></div>
    <div style="font-size:12px;color:var(--sub);margin-top:16px;"></div>
  </div>
</div>

<!-- ADMIN -->
<div id="admin-screen">
  <div class="topbar">
    <div class="topbar-left">
      <span class="admin-badge">ADMIN</span>
      <span class="topbar-title">SineEasy Admin</span>
    </div>
    <div class="topbar-right">
      <a href="index.html" target="_blank" class="btn-preview">👁 ดู Catalog</a>
      <button class="btn-logout" onclick="doLogout()">ออกจากระบบ</button>
    </div>
  </div>

  <!-- NAV TABS -->
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="switchPage('products', this)">📦 สินค้า</button>
    <button class="nav-tab" onclick="switchPage('categories', this)">🏷 หมวดหมู่</button>
  </div>

  <div class="main">

    <!-- ===== PAGE: PRODUCTS ===== -->
    <div id="page-products" class="page active">
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-label">สินค้าทั้งหมด</div>
          <div class="stat-val" id="stat-total">0</div>
          <div class="stat-sub">รายการ</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">หมวดหมู่</div>
          <div class="stat-val" id="stat-cats">0</div>
          <div class="stat-sub">หมวด</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">พร้อมส่ง</div>
          <div class="stat-val" id="stat-ready">0</div>
          <div class="stat-sub">รายการ</div>
        </div>
      </div>

      <!-- Category filter -->
      <div class="cat-filter-bar" id="cat-filter-bar">
        <button class="cat-filter-btn active" data-cat="all" onclick="filterProducts('all', this)">ทั้งหมด</button>
      </div>

      <div class="sec-header">
        <div class="sec-title" id="product-list-title">รายการสินค้าทั้งหมด</div>
        <button class="btn-add" onclick="openForm()">+ เพิ่มสินค้า</button>
      </div>
      <div id="product-list" class="product-list"></div>
    </div>

    <!-- ===== PAGE: CATEGORIES ===== -->
    <div id="page-categories" class="page">
      <div class="sec-header">
        <div class="sec-title">หมวดหมู่สินค้า</div>
        <button class="btn-add" onclick="openCatForm()">+ เพิ่มหมวดหมู่</button>
      </div>
      <div id="cat-list" class="cat-list"></div>
    </div>

  </div>
</div>

<!-- FORM MODAL -->
<div class="modal-overlay" id="form-modal">
  <div class="modal-box">
    <div class="modal-title" id="form-title">เพิ่มสินค้าใหม่</div>

    <div class="form-group">
      <label class="form-label">รูปสินค้า</label>
      <!-- รูปที่เพิ่มแล้ว -->
      <div id="img-preview-list"></div>
      <!-- ปุ่มเพิ่มรูป + placeholder -->
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <button class="img-add-btn" id="upload-area">
          <input type="file" accept="image/*" multiple onchange="handleImg(event)" id="img-file">
          <span style="font-size:22px">📷</span>
          <span>เพิ่มรูป</span>
        </button>
        <div id="upload-placeholder" style="font-size:12px;color:var(--sub)">
          เลือกได้หลายรูป<br>JPG, PNG ≤10MB
        </div>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">ชื่อสินค้า *</label>
      <input class="form-input" type="text" id="f-name" placeholder="เช่น ตู้เสื้อผ้าลายหินอ่อน">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">หมวดหมู่ *</label>
        <select class="form-select" id="f-cat">
          <option value="">-- เลือกหมวดหมู่ --</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">ขนาด</label>
        <input class="form-input" type="text" id="f-size" placeholder="เช่น 160×100 ซม.">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">ราคา (บาท) *</label>
        <input class="form-input" type="number" id="f-price" placeholder="3390">
      </div>
      <div class="form-group">
        <label class="form-label">ผ่อนเดือนละ</label>
        <input class="form-input" type="text" id="f-install" placeholder="เช่น 1,130/เดือน × 3 งวด">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">รายละเอียดเพิ่มเติม</label>
      <textarea class="form-textarea" id="f-desc" placeholder="อธิบายสินค้า..."></textarea>
    </div>

    <div class="form-group">
      <label class="form-label">Badge / สถานะ</label>
      <div class="badge-opts">
        <button class="badge-opt" data-val="ready" onclick="toggleBadge(this)">✓ พร้อมส่ง</button>
        <button class="badge-opt" data-val="hot" onclick="toggleBadge(this)">🔥 ขายดี</button>
        <button class="badge-opt" data-val="new" onclick="toggleBadge(this)">✨ ใหม่</button>
        <button class="badge-opt" data-val="sale" onclick="toggleBadge(this)">💚 ลดราคา</button>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeForm()">ยกเลิก</button>
      <button class="btn-save" onclick="saveProduct()">💾 บันทึก</button>
    </div>
  </div>
</div>

<!-- DELETE CONFIRM -->
<div class="modal-overlay" id="del-modal">
  <div class="confirm-box">
    <div class="confirm-icon">🗑</div>
    <div class="confirm-title">ลบสินค้า?</div>

    <div class="confirm-btns">
      <button class="btn-confirm-cancel" onclick="document.getElementById('del-modal').classList.remove('open')">ยกเลิก</button>
      <button class="btn-confirm-del" onclick="confirmDelete()">ลบเลย</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="cat-form-modal">
  <div class="modal-box" style="max-width:400px">
    <div class="modal-title" id="cat-form-title">เพิ่มหมวดหมู่ใหม่</div>
    <div class="form-group">
      <label class="form-label">ไอคอน Emoji</label>

    <div class="confirm-btns">

      <button class="btn-confirm-del" onclick="confirmDeleteCat()">ลบเลย</button>
    </div>
  </div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxcRHYBqvoLKVSmuF-PnM8dJM4gy6cYhiElXerfPx-NMJh6Voz4s5Ntmj0Vb8HDDDE/exec';
const ADMIN_PASSWORD  = 'admin1234';
const IMGBB_KEY       = 'aed6617dbdca6c61ba88052b3d1930de';
const BADGE_LABELS    = { ready:'✓ พร้อมส่ง', hot:'🔥 ขายดี', new:'✨ ใหม่', sale:'💚 ลดราคา' };

let products    = [];
let categories  = [];
let editId      = null;
let deleteId    = null;
let editCatId   = null;
let deleteCatId = null;
let imgFiles    = [];
let currentFilter = 'all';

// ===== JSONP =====
function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cb = 'cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;

    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error('JSONP timeout'));
    }, 15000);

    function cleanup() {
      clearTimeout(timeout);
      if (window[cb]) delete window[cb];
      if (document.body.contains(script)) document.body.removeChild(script);
    }

    window[cb] = (data) => { cleanup(); resolve(data); };
    script.onerror = () => { cleanup(); reject(new Error('JSONP failed')); };
    document.body.appendChild(script);
  });
}

async function apiGet(action, params = {}) {
  let url = APPS_SCRIPT_URL + '?action=' + action;
  Object.entries(params).forEach(([k,v]) => url += '&' + k + '=' + encodeURIComponent(v));
  return jsonp(url);
}

async function apiCall(action, payload = {}) {
  let url = APPS_SCRIPT_URL + '?action=' + action + '&password=' + ADMIN_PASSWORD;
  if (payload.id)      url += '&id='   + encodeURIComponent(payload.id);
  if (payload.product) url += '&data=' + encodeURIComponent(JSON.stringify(payload.product));
  if (payload.name)    url += '&name=' + encodeURIComponent(payload.name);
  if (payload.icon)    url += '&icon=' + encodeURIComponent(payload.icon);
  return jsonp(url);
}

// ===== SESSION =====
function checkSession() {
  if (sessionStorage.getItem('admin_logged_in') === 'yes') {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    loadAll();
  }
}

function doLogin() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  if (u === 'admin' && p === '1234') {
    sessionStorage.setItem('admin_logged_in', 'yes');
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    loadAll();
  } else {
    document.getElementById('login-err').textContent = 'Username หรือ Password ไม่ถูกต้อง';
  }
}

function doLogout() {
  sessionStorage.removeItem('admin_logged_in');
  document.getElementById('admin-screen').style.display = 'none';
  document.getElementById('login-screen').style.display  = 'flex';
  document.getElementById('login-pass').value = '';
}

// ===== NAV =====
function switchPage(page, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  btn.classList.add('active');
}

// ===== LOAD ALL =====
async function loadAll() {
  await Promise.all([loadCategories(), loadProducts()]);
}

// ===== LOAD CATEGORIES =====
async function loadCategories() {
  try {
    const data = await apiGet('list_cats');
    categories = data.categories || [];
    renderCategories();
    renderCatFilter();
    updateCatSelect();
  } catch(e) { console.error(e); }
}

function renderCategories() {
  const list = document.getElementById('cat-list');
  if (!categories.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">🏷</div><div class="empty-text">ยังไม่มีหมวดหมู่</div></div>`;
    return;
  }
  list.innerHTML = categories.map(c => {
    const count = products.filter(p => p.cat === c.name).length;
    return `
    <div class="cat-row">
      <div class="cat-icon-preview">${c.icon || '📦'}</div>
      <div class="cat-name">${c.name}</div>
      <div class="cat-count">${count} สินค้า</div>
      <div class="prod-actions">
        <button class="btn-edit" onclick="openCatForm('${c.id}')">✏️</button>
        <button class="btn-del"  onclick="askDeleteCat('${c.id}')">🗑</button>
      </div>
    </div>`;
  }).join('');
}

function renderCatFilter() {
  const bar = document.getElementById('cat-filter-bar');
  const allBtn = `<button class="cat-filter-btn ${currentFilter==='all'?'active':''}" data-cat="all" onclick="filterProducts('all',this)">ทั้งหมด</button>`;
  const catBtns = categories.map(c =>
    `<button class="cat-filter-btn ${currentFilter===c.name?'active':''}" data-cat="${c.name}" onclick="filterProducts('${c.name}',this)">${c.icon} ${c.name}</button>`
  ).join('');
  bar.innerHTML = allBtn + catBtns;
}

function updateCatSelect() {
  const sel = document.getElementById('f-cat');
  if (!sel) return;
  const cur = sel.value;
  sel.innerHTML = '<option value="">-- เลือกหมวดหมู่ --</option>' +
    categories.map(c => `<option value="${c.name}" ${cur===c.name?'selected':''}>${c.icon} ${c.name}</option>`).join('');
}

// ===== FILTER PRODUCTS =====
function filterProducts(cat, btn) {
  currentFilter = cat;
  document.querySelectorAll('.cat-filter-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  const title = document.getElementById('product-list-title');
  if (cat === 'all') {
    title.textContent = 'รายการสินค้าทั้งหมด';
    renderList(products);
  } else {
    const cat_obj = categories.find(c => c.name === cat);
    title.textContent = `${cat_obj?.icon||''} ${cat} (${products.filter(p=>p.cat===cat).length} รายการ)`;
    renderList(products.filter(p => p.cat === cat));
  }
}

// ===== LOAD PRODUCTS =====
async function loadProducts() {
  document.getElementById('product-list').innerHTML =
    `<div class="empty"><div class="empty-icon">⏳</div><div class="empty-text">กำลังโหลด...</div></div>`;
  try {
    const data = await apiGet('list');
    products = data.products || [];
    const cats = new Set(products.map(p => p.cat));
    document.getElementById('stat-total').textContent  = products.length;
    document.getElementById('stat-cats').textContent   = cats.size;
    document.getElementById('stat-ready').textContent  = products.filter(p => p.badge==='ready'||p.badge==='hot').length;
    filterProducts(currentFilter, null);
    renderCategories();
  } catch {
    document.getElementById('product-list').innerHTML =
      `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">โหลดไม่ได้</div></div>`;
  }
}

function renderList(list) {
  const el = document.getElementById('product-list');
  if (!list.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">📦</div><div class="empty-text">ไม่มีสินค้าในหมวดนี้</div></div>`;
    return;
  }
  el.innerHTML = list.map(p => {
    const imgs  = p.img ? p.img.split('|').filter(Boolean) : [];
    const catObj = categories.find(c => c.name === p.cat);
    return `
    <div class="product-row">
      <div class="prod-thumb" style="position:relative">
        ${imgs.length ? `<img src="${imgs[0]}" alt="${p.name}">` : (catObj?.icon||'📦')}
        ${imgs.length > 1 ? `<span style="position:absolute;bottom:2px;right:2px;background:#000a;color:#fff;font-size:9px;padding:1px 4px;border-radius:6px">+${imgs.length-1}</span>` : ''}
      </div>
      <div class="prod-info">
        <div class="prod-name">${p.name}</div>
        <div class="prod-meta">${p.cat ? (catObj?.icon||'')+ ' '+p.cat+' · ' : ''}${p.price ? p.price+' บาท' : ''}</div>
      </div>
      ${p.badge ? `<span style="font-size:11px;color:var(--gold);flex-shrink:0">${BADGE_LABELS[p.badge]||''}</span>` : ''}
      <div class="prod-actions">
        <button class="btn-edit" onclick="openForm('${p.id}')">✏️ แก้ไข</button>
        <button class="btn-del"  onclick="askDelete('${p.id}')">🗑</button>
      </div>
    </div>`;
  }).join('');
}

// ===== PRODUCT FORM =====
function openForm(id = null) {
  editId = id; imgFiles = [];
  document.getElementById('form-title').textContent = id ? 'แก้ไขสินค้า' : 'เพิ่มสินค้าใหม่';
  ['f-name','f-size','f-price','f-install','f-desc'].forEach(i => document.getElementById(i).value = '');
  document.getElementById('f-cat').value = '';
  document.querySelectorAll('.badge-opt').forEach(b => b.classList.remove('sel'));
  resetImgPreview();
  updateCatSelect();

  if (id) {
    const p = products.find(x => x.id == id);
    if (p) {
      document.getElementById('f-name').value    = p.name    || '';
      document.getElementById('f-cat').value     = p.cat     || '';
      document.getElementById('f-size').value    = p.size    || '';
      document.getElementById('f-price').value   = p.price   ? p.price.replace(/,/g,'') : '';
      document.getElementById('f-install').value = p.install || '';
      document.getElementById('f-desc').value    = p.desc    || '';
      if (p.badge) document.querySelector(`.badge-opt[data-val="${p.badge}"]`)?.classList.add('sel');
      if (p.img)   renderImgPreviews(p.img.split('|').filter(Boolean));
    }
  }
  document.getElementById('form-modal').classList.add('open');
}

function closeForm() {
  document.getElementById('form-modal').classList.remove('open');
  editId = null; imgFiles = [];
}

async function saveProduct() {
  const name  = document.getElementById('f-name').value.trim();
  const price = document.getElementById('f-price').value.trim();
  const cat   = document.getElementById('f-cat').value;
  if (!name || !price) { showToast('กรุณากรอกชื่อสินค้าและราคา', 'error'); return; }
  if (!cat)            { showToast('กรุณาเลือกหมวดหมู่', 'error'); return; }

  const btn = document.querySelector('.btn-save');
  btn.textContent = '⏳ กำลังบันทึก...'; btn.disabled = true;

  try {
    const newUrls  = await uploadAllImages();
    const keptUrls = getKeptUrls();
    const allUrls  = [...keptUrls, ...newUrls];
    const badge    = document.querySelector('.badge-opt.sel')?.dataset.val || '';
    const priceStr = parseInt(price.replace(/,/g,'')).toLocaleString();
    const product  = {
      name, cat, badge,
      price:   priceStr,
      size:    document.getElementById('f-size').value.trim(),
      install: document.getElementById('f-install').value.trim(),
      desc:    document.getElementById('f-desc').value.trim(),
      img:     allUrls.join('|')
    };

    if (editId) { await apiCall('update', { id: editId, product }); }
    else        { await apiCall('add',    { product }); }

    showToast(editId ? '✅ แก้ไขแล้ว' : '✅ เพิ่มสินค้าแล้ว', 'success');
    closeForm();
    await loadProducts();
  } catch(err) {
    showToast('❌ ' + (err.message||'บันทึกไม่สำเร็จ'), 'error');
  } finally {
    btn.textContent = '💾 บันทึก'; btn.disabled = false;
  }
}

// ===== CATEGORY FORM =====
function openCatForm(id = null) {
  editCatId = id;
  document.getElementById('cat-form-title').textContent = id ? 'แก้ไขหมวดหมู่' : 'เพิ่มหมวดหมู่ใหม่';
  document.getElementById('cf-name').value = '';
  document.getElementById('cf-icon').value = '📦';
  if (id) {
    const c = categories.find(x => x.id == id);
    if (c) {
      document.getElementById('cf-name').value = c.name || '';
      document.getElementById('cf-icon').value = c.icon || '📦';
    }
  }
  document.getElementById('cat-form-modal').classList.add('open');
}

function closeCatForm() {
  document.getElementById('cat-form-modal').classList.remove('open');
  editCatId = null;
}

async function saveCat() {
  const name = document.getElementById('cf-name').value.trim();
  const icon = document.getElementById('cf-icon').value.trim() || '📦';
  if (!name) { showToast('กรุณากรอกชื่อหมวดหมู่', 'error'); return; }

  const btn = document.getElementById('cat-save-btn');
  btn.textContent = '⏳...'; btn.disabled = true;

  try {
    if (editCatId) { await apiCall('update_cat', { id: editCatId, name, icon }); }
    else           { await apiCall('add_cat',    { name, icon }); }
    showToast(editCatId ? '✅ แก้ไขหมวดหมู่แล้ว' : '✅ เพิ่มหมวดหมู่แล้ว', 'success');
    closeCatForm();
    await loadCategories();
  } catch { showToast('❌ บันทึกไม่สำเร็จ', 'error'); }
  finally  { btn.textContent = '💾 บันทึก'; btn.disabled = false; }
}

function askDeleteCat(id) {
  deleteCatId = id;
  const c = categories.find(x => x.id == id);
  document.getElementById('del-cat-name').textContent = `"${c?.name||'หมวดหมู่นี้'}"`;
  document.getElementById('del-cat-modal').classList.add('open');
}

async function confirmDeleteCat() {
  document.getElementById('del-cat-modal').classList.remove('open');
  try {
    await apiCall('delete_cat', { id: deleteCatId });
    showToast('🗑 ลบหมวดหมู่แล้ว', 'success');
    await loadCategories();
  } catch { showToast('❌ ลบไม่สำเร็จ', 'error'); }
}

// ===== IMGBB UPLOAD =====
async function uploadToImgbb(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = async (e) => {
      const base64 = e.target.result.split(',')[1];
      const body   = new URLSearchParams();
      body.append('key', IMGBB_KEY);
      body.append('image', base64);
      try {
        const res  = await fetch('https://api.imgbb.com/1/upload', {
          method:'POST',
          headers:{'Content-Type':'application/x-www-form-urlencoded'},
          body: body.toString()
        });
        const data = await res.json();
        if (data.success) resolve(data.data.display_url);
        else reject(new Error(JSON.stringify(data.error)));
      } catch(err) { reject(err); }
    };
    reader.readAsDataURL(file);
  });
}

async function uploadAllImages() {
  const urls = [];
  for (let i = 0; i < imgFiles.length; i++) {
    showToast(`⏳ upload รูป ${i+1}/${imgFiles.length}...`, 'success');
    urls.push(await uploadToImgbb(imgFiles[i]));
  }
  return urls;
}

function handleImg(e) {
  const files = Array.from(e.target.files);
  imgFiles = [...imgFiles, ...files];
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = ev => addImgPreview(ev.target.result, null, file.name);
    reader.readAsDataURL(file);
  });
  e.target.value = '';
}

function addImgPreview(src, existingUrl=null, label='') {
  const wrap = document.getElementById('img-preview-list');
  const div  = document.createElement('div');
  div.className   = 'img-thumb';
  div.dataset.url = existingUrl || '';
  div.dataset.new = existingUrl ? 'false' : 'true';
  div.innerHTML   = `<img src="${src}" alt="${label}"><button class="img-thumb-del" onclick="removeImgThumb(this)">✕</button>${!existingUrl?'<span class="img-thumb-badge">ใหม่</span>':''}`;
  wrap.appendChild(div);
  document.getElementById('upload-placeholder').style.display = 'none';
}

function renderImgPreviews(urls) { urls.forEach(url => addImgPreview(url, url)); }

function removeImgThumb(btn) {
  const div = btn.closest('.img-thumb');
  if (div.dataset.new === 'true') imgFiles = imgFiles.filter((_,i) => i !== [...document.querySelectorAll('.img-thumb[data-new="true"]')].indexOf(div));
  div.remove();
  if (!document.querySelectorAll('.img-thumb').length) document.getElementById('upload-placeholder').style.display = 'block';
}

function getKeptUrls() {
  return Array.from(document.querySelectorAll('.img-thumb[data-new="false"]')).map(d => d.dataset.url).filter(Boolean);
}

function resetImgPreview() {
  document.getElementById('img-preview-list').innerHTML = '';
  document.getElementById('upload-placeholder').style.display = 'block';
  document.getElementById('img-file').value = '';
  imgFiles = [];
}

// ===== DELETE PRODUCT =====
function askDelete(id) {
  deleteId = id;
  const p = products.find(x => x.id == id);
  document.getElementById('del-name').textContent = `"${p?.name||'สินค้านี้'}"`;
  document.getElementById('del-modal').classList.add('open');
}

async function confirmDelete() {
  document.getElementById('del-modal').classList.remove('open');
  try {
    await apiCall('delete', { id: deleteId });
    showToast('🗑 ลบสินค้าแล้ว', 'success');
    await loadProducts();
  } catch { showToast('❌ ลบไม่สำเร็จ', 'error'); }
}

// ===== BADGE =====
function toggleBadge(btn) {
  const was = btn.classList.contains('sel');
  document.querySelectorAll('.badge-opt').forEach(b => b.classList.remove('sel'));
  if (!was) btn.classList.add('sel');
}

// ===== TOAST =====
function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ===== MODAL CLOSE =====
['form-modal','del-modal','cat-form-modal','del-cat-modal'].forEach(id => {
  document.getElementById(id)?.addEventListener('click', e => {
    if (e.target.id === id) document.getElementById(id).classList.remove('open');
  });
});

checkSession();
</script>

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sine - Catalog</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gold: #c8a96e;
    --dark: #1a1a1a;
    --bg: #f5f2ee;
    --card: #ffffff;
    --text: #1a1a1a;
    --sub: #888;
    --border: #e8e4de;
  }

  body {
    background: var(--bg);
    font-family: 'Sarabun', sans-serif;
    color: var(--text);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
  }

  /* ===== HEADER ===== */
  .header {
    background: var(--dark);
    padding: 20px 20px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    color: #fff;
    letter-spacing: 1px;
  }

  .logo-sub {
    font-size: 10px;
    color: var(--gold);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .cart-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 8px 14px;
    color: #fff;
    font-family: 'Sarabun', sans-serif;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ===== CATEGORY TABS ===== */
  .cat-scroll {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 2px;
  }

  .cat-scroll::-webkit-scrollbar { display: none; }

  .cat-tab {
    flex-shrink: 0;
    padding: 7px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-family: 'Sarabun', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    border: 1.5px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.6);
    background: transparent;
    white-space: nowrap;
  }

  .cat-tab.active {
    background: var(--gold);
    border-color: var(--gold);
    color: #fff;
    font-weight: 600;
  }

  /* ===== BODY ===== */
  .body {
    padding: 20px 16px;
  }

  /* ===== SECTION ===== */
  .section {
    margin-bottom: 32px;
    display: none;
  }

  .section.visible { display: block; }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    margin-bottom: 4px;
  }

  .section-count {
    font-size: 12px;
    color: var(--sub);
    margin-bottom: 16px;
  }

  /* ===== PRODUCT GRID ===== */
  .product-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .product-card {
    background: var(--card);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    position: relative;
  }

  .product-card:active {
    transform: scale(0.97);
  }

  .product-card.featured {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  /* Image */
  .p-img {
    height: 160px;
    position: relative;
    overflow: hidden;
  }

  .product-card.featured .p-img {
    height: 180px;
  }

  .p-img-inner {
    width: 100%;
    height: 100%;
    transition: transform 0.3s;
  }

  .product-card:hover .p-img-inner {
    transform: scale(1.05);
  }

  /* Marble placeholders */
  .marble-white {
    background: linear-gradient(135deg, #f8f4f0 0%, #e8e3dc 30%, #f5f0ea 60%, #ddd8d0 100%);
  }
  .marble-black {
    background: linear-gradient(135deg, #1c1c1c 0%, #2d2d2d 40%, #111 70%, #333 100%);
  }
  .marble-gray {
    background: linear-gradient(135deg, #9a9a9a 0%, #707070 40%, #888 70%, #606060 100%);
  }
  .marble-beige {
    background: linear-gradient(135deg, #e8d9c5 0%, #d4c4a8 40%, #e0ccb0 70%, #c8b898 100%);
  }

  .p-img-inner::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      -55deg,
      transparent 0px,
      transparent 15px,
      rgba(255,255,255,0.07) 15px,
      rgba(255,255,255,0.07) 16px
    );
  }

  /* Badge */
  .p-badge {
    position: absolute;
    top: 8px;
    left: 8px;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 20px;
    z-index: 2;
  }

  .badge-ready { background: #1a1a1a; color: #fff; }
  .badge-hot { background: #e74c3c; color: #fff; }
  .badge-new { background: var(--gold); color: #fff; }
  .badge-sale { background: #27ae60; color: #fff; }

  /* Info */
  .p-info {
    padding: 12px;
  }

  .product-card.featured .p-info {
    padding: 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .p-name {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 4px;
    color: var(--dark);
  }

  .product-card.featured .p-name {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
  }

  .p-size {
    font-size: 11px;
    color: var(--sub);
    margin-bottom: 8px;
  }

  .p-price {
    font-size: 16px;
    font-weight: 700;
    color: var(--dark);
  }

  .p-price span {
    font-size: 11px;
    font-weight: 400;
    color: var(--sub);
  }

  .p-install {
    font-size: 11px;
    color: var(--gold);
    margin-top: 2px;
  }

  .p-colors {
    display: flex;
    gap: 4px;
    margin-top: 8px;
  }

  .p-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 1.5px solid #ddd;
  }

  .p-dot.white { background: #f0ece6; }
  .p-dot.black { background: #1a1a1a; border-color: #555; }
  .p-dot.gray  { background: #888; border-color: #999; }
  .p-dot.beige { background: #d4c4a8; }

  .p-btn {
    display: block;
    width: calc(100% - 24px);
    margin: 0 12px 12px;
    padding: 10px;
    background: var(--dark);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: 'Sarabun', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: background 0.2s;
  }

  .p-btn:hover { background: var(--gold); }

  /* ===== MODAL ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 200;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: #fff;
    width: 100%;
    max-width: 480px;
    border-radius: 24px 24px 0 0;
    padding: 24px 24px 36px;
    animation: slideUp 0.3s ease;
    max-height: 85vh;
    overflow-y: auto;
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }

  .modal-handle {
    width: 40px;
    height: 4px;
    background: #ddd;
    border-radius: 2px;
    margin: 0 auto 20px;
  }

  .modal-img {
    height: 200px;
    border-radius: 16px;
    margin-bottom: 16px;
  }

  .modal-cat { font-size: 11px; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; }
  .modal-name { font-family: 'Playfair Display', serif; font-size: 22px; margin-bottom: 4px; }
  .modal-size { font-size: 13px; color: var(--sub); margin-bottom: 16px; }

  .modal-price-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #faf8f5;
    border-radius: 14px;
    padding: 14px 18px;
    margin-bottom: 16px;
  }

  .modal-price { font-size: 26px; font-weight: 700; }
  .modal-install { text-align: right; font-size: 13px; color: var(--gold); font-weight: 600; }
  .modal-install small { display: block; color: var(--sub); font-size: 11px; font-weight: 400; }

  .modal-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .modal-tag { font-size: 12px; padding: 5px 12px; background: #f5f0eb; color: #8a7355; border-radius: 20px; }

  .modal-cta {
    width: 100%;
    padding: 16px;
    background: var(--dark);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-family: 'Sarabun', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 10px;
  }

  .modal-close {
    width: 100%;
    padding: 12px;
    background: transparent;
    color: var(--sub);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    font-family: 'Sarabun', sans-serif;
    font-size: 14px;
    cursor: pointer;
  }

  /* ===== TOAST ===== */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--dark);
    color: #fff;
    padding: 12px 24px;
    border-radius: 30px;
    font-size: 14px;
    z-index: 300;
    transition: transform 0.3s;
    white-space: nowrap;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ===== ALL SECTION ===== */
  .all-section { margin-bottom: 24px; }

  .all-section-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
  }

  .all-section-title { font-weight: 700; font-size: 15px; }
  .all-section-more { font-size: 12px; color: var(--gold); cursor: pointer; }

</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-top">
    <div>
      <div class="logo">MARBLE HOME</div>
      <div class="logo-sub">Furniture Collection</div>
    </div>
    <button class="cart-btn">💬 ติดต่อร้าน</button>
  </div>
  <div class="cat-scroll" id="cat-tabs">
    <!-- render by JS -->
  </div>
</div>

<!-- Body -->
<div class="body" id="catalog-body">
  <!-- render by JS -->
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div id="modal-img" class="modal-img marble-white"></div>
    <div class="modal-cat" id="modal-cat"></div>
    <div class="modal-name" id="modal-name"></div>
    <div class="modal-size" id="modal-size"></div>
    <div class="modal-price-row">
      <div>
        <div style="font-size:11px;color:#aaa;margin-bottom:2px;">ราคา</div>
        <div class="modal-price" id="modal-price"></div>
      </div>
      <div class="modal-install" id="modal-install"></div>
    </div>
    <div class="modal-tags" id="modal-tags"></div>
    <button class="modal-cta" id="modal-cta-btn">💬 สนใจสินค้า / ติดต่อร้าน</button>
    <button class="modal-close" onclick="closeModal()">ปิด</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ===================================================
// 🔧 ใส่ URL ของ Apps Script ที่ Deploy แล้วตรงนี้
// ===================================================
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxcRHYBqvoLKVSmuF-PnM8dJM4gy6cYhiElXerfPx-NMJh6Voz4s5Ntmj0Vb8HDDDE/exec';

const BADGE_LABELS = { ready:'✓ พร้อมส่ง', hot:'🔥 ขายดี', new:'✨ ใหม่', sale:'💚 ลดราคา' };
const BADGE_CLASSES = { ready:'badge-ready', hot:'badge-hot', new:'badge-new', sale:'badge-sale' };
const CAT_ICONS = { 'ตู้เสื้อผ้า':'👔', 'เตียงนอน':'🛏', 'โต๊ะ':'🪑', 'ชั้นวาง':'📚', 'อื่นๆ':'📦' };

let allProducts = [];
let currentCat = 'all';

// ===== FETCH DATA =====
async function loadProducts() {
  showSkeleton();
  try {
    const res = await fetch(APPS_SCRIPT_URL);
    const data = await res.json();
    allProducts = data.products || [];
    renderCatTabs();
    renderCatalog('all');
  } catch (e) {
    document.getElementById('catalog-body').innerHTML = `
      <div style="text-align:center;padding:60px 20px;color:#888">
        <div style="font-size:36px;margin-bottom:12px">⚠️</div>
        <div>ไม่สามารถโหลดสินค้าได้<br>กรุณาตรวจสอบการเชื่อมต่อ</div>
      </div>`;
  }
}

// ===== SKELETON LOADING =====
function showSkeleton() {
  const body = document.getElementById('catalog-body');
  body.innerHTML = `
    <div style="padding:20px 16px">
      ${[1,2,3,4].map(() => `
        <div style="background:#fff;border-radius:16px;margin-bottom:12px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr">
          <div style="height:160px;background:linear-gradient(90deg,#f0ece6 25%,#e8e4de 50%,#f0ece6 75%);background-size:200% 100%;animation:shimmer 1.2s infinite"></div>
          <div style="padding:14px">
            <div style="height:14px;background:#f0ece6;border-radius:4px;margin-bottom:8px;animation:shimmer 1.2s infinite"></div>
            <div style="height:10px;background:#f0ece6;border-radius:4px;width:60%;margin-bottom:8px;animation:shimmer 1.2s infinite"></div>
            <div style="height:18px;background:#f0ece6;border-radius:4px;width:50%;animation:shimmer 1.2s infinite"></div>
          </div>
        </div>`).join('')}
    </div>
    <style>@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}</style>`;
}

// ===== RENDER CATEGORY TABS =====
function renderCatTabs() {
  const cats = ['all', ...new Set(allProducts.map(p => p.cat))];
  const catNames = { all: 'ทั้งหมด' };
  allProducts.forEach(p => { catNames[p.cat] = p.cat; });

  document.getElementById('cat-tabs').innerHTML = cats.map(c => `
    <button class="cat-tab ${c === 'all' ? 'active' : ''}"
      onclick="filterCat('${c}', this)">
      ${c === 'all' ? 'ทั้งหมด' : (CAT_ICONS[c] || '') + ' ' + c}
    </button>`).join('');
}

// ===== RENDER CATALOG =====
function renderCatalog(cat) {
  currentCat = cat;
  const body = document.getElementById('catalog-body');

  if (cat === 'all') {
    // Group by category
    const cats = [...new Set(allProducts.map(p => p.cat))];
    if (!cats.length) {
      body.innerHTML = `<div style="text-align:center;padding:60px 20px;color:#888"><div style="font-size:36px">📦</div><div style="margin-top:12px">ยังไม่มีสินค้า</div></div>`;
      return;
    }
    body.innerHTML = cats.map(c => {
      const items = allProducts.filter(p => p.cat === c);
      return `
        <div class="body" style="padding:20px 16px 0">
          <div class="all-section">
            <div class="all-section-header">
              <div class="all-section-title">${CAT_ICONS[c] || '📦'} ${c}</div>
              <div class="all-section-more" onclick="filterCatByName('${c}')">ดูทั้งหมด →</div>
            </div>
            <div class="product-grid">
              ${items.slice(0,4).map((p,i) => productCardHTML(p, allProducts.indexOf(p), i===0 && items.length>=2)).join('')}
            </div>
          </div>
        </div>`;
    }).join('');
  } else {
    const items = allProducts.filter(p => p.cat === cat);
    body.innerHTML = `
      <div class="body" style="padding:20px 16px">
        <div style="font-size:18px;font-weight:700;margin-bottom:4px">${CAT_ICONS[cat] || ''} ${cat}</div>
        <div style="font-size:12px;color:#888;margin-bottom:16px">${items.length} รายการ</div>
        <div class="product-grid">
          ${items.map((p,i) => productCardHTML(p, allProducts.indexOf(p), i===0)).join('')}
        </div>
      </div>`;
  }
}

// ===== PRODUCT CARD HTML =====
function productCardHTML(p, idx, featured = false) {
  const badgeLabel = BADGE_LABELS[p.badge] || '';
  const badgeClass = BADGE_CLASSES[p.badge] || '';
  const imgContent = p.img
    ? `<img src="${p.img}" style="width:100%;height:100%;object-fit:cover;display:block">`
    : `<div style="width:100%;height:100%;background:linear-gradient(135deg,#f8f4f0,#e0dbd4);display:flex;align-items:center;justify-content:center;font-size:32px">${CAT_ICONS[p.cat] || '🪑'}</div>`;

  return `
    <div class="product-card ${featured ? 'featured' : ''}" onclick="openModal(${idx})">
      <div class="p-img">
        <div class="p-img-inner">${imgContent}</div>
        ${badgeLabel ? `<span class="p-badge ${badgeClass}">${badgeLabel}</span>` : ''}
      </div>
      <div class="p-info">
        <div class="p-name">${p.name}</div>
        ${p.size ? `<div class="p-size">${p.size}</div>` : ''}
        <div class="p-price">${p.price} <span>บาท</span></div>
        ${p.install ? `<div class="p-install">ผ่อน ${p.install}</div>` : ''}
      </div>
      <button class="p-btn" onclick="event.stopPropagation();sendInterest('${p.name}')">สนใจ</button>
    </div>`;
}

// ===== FILTER =====
function filterCat(cat, btn) {
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderCatalog(cat);
}

function filterCatByName(cat) {
  const btn = [...document.querySelectorAll('.cat-tab')].find(t => t.textContent.includes(cat));
  filterCat(cat, btn);
}

// ===== MODAL =====
function openModal(i) {
  const p = allProducts[i];
  const badgeLabel = BADGE_LABELS[p.badge] || '';

  const imgEl = document.getElementById('modal-img');
  if (p.img) {
    imgEl.style.background = 'none';
    imgEl.innerHTML = `<img src="${p.img}" style="width:100%;height:100%;object-fit:cover;border-radius:16px">`;
  } else {
    imgEl.style.background = 'linear-gradient(135deg,#f8f4f0,#e0dbd4)';
    imgEl.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:48px">${CAT_ICONS[p.cat] || '🪑'}</div>`;
  }

  document.getElementById('modal-cat').textContent = p.cat;
  document.getElementById('modal-name').textContent = p.name;
  document.getElementById('modal-size').textContent = p.size ? 'ขนาด ' + p.size : '';
  document.getElementById('modal-price').textContent = p.price + ' บาท';

  const inst = document.getElementById('modal-install');
  if (p.install) {
    inst.innerHTML = `${p.install}<small>การผ่อนชำระ</small>`;
    inst.style.display = 'block';
  } else {
    inst.style.display = 'none';
  }

  const tags = document.getElementById('modal-tags');
  const tagList = [];
  if (badgeLabel) tagList.push(badgeLabel);
  if (p.desc) tagList.push(p.desc);
  tags.innerHTML = tagList.map(t => `<span class="modal-tag">${t}</span>`).join('');

  document.getElementById('modal-cta-btn').onclick = () => sendInterest(p.name);
  document.getElementById('modal').classList.add('open');
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('modal')) {
    document.getElementById('modal').classList.remove('open');
  }
}

function sendInterest(name) {
  document.getElementById('modal').classList.remove('open');
  showToast('✅ ส่งข้อความสนใจ "' + name + '" แล้ว!');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ===== START =====
loadProducts();
</script>

</body>
</html>
